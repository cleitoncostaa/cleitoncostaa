name: Profile quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate profile README
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "Cleiton Costa" README.md
          if git grep -nE 'ghp_|github_pat_|sk-[A-Za-z0-9_-]{20,}|-----BEGIN .*PRIVATE KEY-----|password=|token=' -- README.md; then
            exit 1
          fi
